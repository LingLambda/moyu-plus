name: MoyuPro
options:
  bundleIdPrefix: com.ling
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
packages:
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    exactVersion: 1.3.1
targets:
  MoyuPro:
    type: application
    platform: macOS
    sources:
      - path: MoyuPro
        excludes:
          - Support
      - path: Models
        includes:
          - "*.mlpackage"
    dependencies:
      - package: MenuBarExtraAccess
    resources:
      - path: MoyuPro/Resources
    info:
      path: MoyuPro/Support/Info.plist
      properties:
        CFBundleDisplayName: 大墨鱼
        CFBundleName: MoyuPro
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        LSUIElement: true
        NSCameraUsageDescription: 系统需要使用摄像头。
        NSHumanReadableCopyright: Copyright © 2026 moyu-pro contributors. AGPL-3.0 licensed.
    entitlements:
      path: MoyuPro/Support/MoyuPro.entitlements
      properties:
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ling.MoyuPro
        PRODUCT_NAME: MoyuPro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - MoyuProTests
  MoyuProTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MoyuProTests
    dependencies:
      - target: MoyuPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ling.MoyuProTests
        GENERATE_INFOPLIST_FILE: YES
