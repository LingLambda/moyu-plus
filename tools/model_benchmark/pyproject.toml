[project]
name = "moyu-pro-model-benchmark"
version = "0.1.0"
description = "YOLO26 Core ML export and benchmark utilities for moyu-pro"
requires-python = ">=3.12,<3.13"
dependencies = [
  "coremltools>=9.0",
  "numpy>=2.0,<=2.3.5",
  "pillow>=11.0",
  "pycocotools>=2.0.10",
  "scikit-learn>=1.7",
  "ultralytics>=8.3.0",
]

[tool.uv]
package = false
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true
